<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>跑跑卡丁车 · 公告</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; padding: 40px 20px; min-height: 100vh;
      background: #f3f5f9; color: #2b2f36;
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    }
    .wrap { max-width: 680px; margin: 0 auto; }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
    .sub { font-size: 13px; color: #8a919c; margin-bottom: 20px; }
    .card {
      background: #fff; border: 1px solid #e4e7ed; border-radius: 12px;
      padding: 20px 22px; margin-bottom: 14px;
    }
    .date { font-size: 12px; color: #4c9eea; margin-bottom: 6px; }
    .title { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
    .body { font-size: 13px; line-height: 1.8; color: #5a626e; white-space: pre-wrap; }
    .empty { font-size: 13px; color: #8a919c; }
    code { background: #f3f5f9; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      body { background: #1e2126; color: #e6e9ef; }
      .card { background: #272b31; border-color: #3a4048; }
      .body { color: #9ba3ae; }
      code { background: #1b1e23; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>跑跑卡丁车 · 公告</h1>
    <div class="sub">本页读取同目录下的 notice.txt，启动器也读同一份文件</div>
    <div id="list"><div class="card"><div class="empty">正在读取公告…</div></div></div>
    <div class="sub" style="margin-top:18px">
      公告文件地址：<code id="src">notice.txt</code>
    </div>
  </div>

  <script>
    fetch('notice.txt?t=' + Date.now())
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (text) {
        var blocks = text.replace(/\r\n/g, '\n').split(/\n-{3,}\n/);
        var html = '';
        blocks.forEach(function (block) {
          var lines = block.split('\n').filter(function (l) { return l.trim() !== ''; });
          if (!lines.length) return;
          var head = lines[0].trim();
          var date = '';
          var m = head.match(/^(\d{4}[-/]\d{1,2}[-/]\d{1,2}|\d{1,2}[-/]\d{1,2})\s*/);
          if (m) { date = m[1]; head = head.slice(m[0].length); }
          var body = lines.slice(1).join('\n');
          html += '<div class="card">' +
            (date ? '<div class="date">' + esc(date) + '</div>' : '') +
            '<div class="title">' + esc(head) + '</div>' +
            (body ? '<div class="body">' + esc(body) + '</div>' : '') +
            '</div>';
        });
        document.getElementById('list').innerHTML = html || '<div class="card"><div class="empty">暂无公告</div></div>';
      })
      .catch(function (e) {
        document.getElementById('list').innerHTML =
          '<div class="card"><div class="empty">读取 notice.txt 失败（' + e.message + '）</div></div>';
      });

    function esc(s) {
      return s.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; });
    }
  </script>
</body>
</html>
